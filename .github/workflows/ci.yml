name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.26'
  # Pinned to match the local toolchain (golangci-lint 2.12.2) so git hooks,
  # `task lint`, and CI all run the identical linter version.
  GOLANGCI_LINT_VERSION: 'v2.12.2'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 both run: the arm64 leg is the FMA / float-parity
        # gate for the ported DSP (Go may fuse a*b+c on arm64).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go vet ./...
      # Longer than the 10m per-package default: the full `go test ./...`
      # suite is compute-heavy (the Phase 4 encoder's masking-driven
      # escalation in internal/enc, plus internal/dec), so headroom is kept on
      # shared CI runners across amd64 and arm64. Issue #37's
      # bigValuesPrefixCost/rangeCost optimization cut the internal/enc
      # escalation cost, but the suite total is dominated by packages it does
      # not touch, so the slower shared amd64 runner still measures about
      # 10-11 min here; 20m (down from 25m) keeps roughly 2x headroom over that.
      - run: go test ./... -timeout 20m

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  compat:
    name: Compat
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 gains the same leg the test job runs: issue #31's
        # arm64-cross-decoder compat item, previously only covered by the
        # Oracle workflow's differential job (which already runs both
        # arches), now also verified end to end through ffmpeg/mpg123 on
        # real arm64 output rather than only amd64.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # ffmpeg, mpg123, and lame are black-box binaries only (see
      # PROVENANCE.md); their source is never consulted.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mpg123 lame
      # Longer than the 10m per-binary default: this job's total runtime is
      # the base compat grid across all sample rates plus the joint-stereo
      # and short-block matrices, all run through ffmpeg and mpg123, still
      # made compute-heavy by short-block coding, so headroom is kept on
      # shared CI runners, on both amd64 and arm64. This job runs a few
      # minutes; it shares the 20m budget used across all four timeout sites.
      - run: go test ./ -run Compat -v -timeout 20m
        env:
          MP3_REQUIRE_COMPAT: '1'
      # End-to-end runs of the quality harness against lame (a black-box
      # binary too): proves the harness's pcm decode, alignment (go-mp3 lag
      # == mp3.TotalDelay, LAME lag == 0 after pcm's gapless trim) and metric
      # plumbing on both arches. It rides the compat job because that is the
      # job installing the black-box binaries; in the test job, which installs
      # none, these tests skip. 10m rather than the shared 20m: the two cases
      # measure about 15s locally, and each lame call is separately bounded at
      # 5m inside the harness. The full grid is a local tool (`task quality`),
      # not a CI gate.
      - run: go test ./tools/quality -run TestQualityHarness -v -timeout 10m
        env:
          MP3_REQUIRE_LAME: '1'
