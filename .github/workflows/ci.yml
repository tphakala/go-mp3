name: CI
on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: '1.26'
  # Pinned to match the local toolchain (golangci-lint 2.12.2) so git hooks,
  # `task lint`, and CI all run the identical linter version.
  GOLANGCI_LINT_VERSION: 'v2.12.2'

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # amd64 and arm64 both run: the arm64 leg is the FMA / float-parity
        # gate for the ported DSP (Go may fuse a*b+c on arm64).
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go build ./...
      - run: go vet ./...
      # Longer than the 10m per-package default: the Phase 4 encoder's
      # masking-driven budget escalation still makes the internal/enc suite
      # compute-heavy on low-bitrate broadband test content, so headroom is
      # kept on shared CI runners, on both amd64 and arm64. Issue #37's
      # bigValuesPrefixCost/rangeCost optimization cut the full `go test
      # ./...` wall time to about 323s locally, so the previous 25m no
      # longer reflects the real cost; 15m keeps roughly 2x headroom.
      - run: go test ./... -timeout 15m

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  compat:
    name: Compat
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        # arm64 gains the same leg the test job runs: issue #31's
        # arm64-cross-decoder compat item, previously only covered by the
        # Oracle workflow's differential job (which already runs both
        # arches), now also verified end to end through ffmpeg/mpg123 on
        # real arm64 output rather than only amd64.
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
      # ffmpeg and mpg123 are black-box decode references only (see
      # PROVENANCE.md); their source is never consulted.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg mpg123
      # Longer than the 10m per-binary default: this job's total runtime is
      # the base compat grid across all sample rates plus the joint-stereo
      # and short-block matrices, all run through ffmpeg and mpg123, still
      # made compute-heavy by short-block coding, so headroom is kept on
      # shared CI runners, on both amd64 and arm64. Issue #37's
      # bigValuesPrefixCost/rangeCost optimization cut this job to about
      # 109s locally, well under the shared 15m budget used across all four
      # timeout sites.
      - run: go test ./ -run Compat -v -timeout 15m
        env:
          MP3_REQUIRE_COMPAT: '1'
