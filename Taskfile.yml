version: '3'

tasks:
  build:
    cmds: [go build ./...]
  vet:
    cmds: [go vet ./...]
  test:
    # -timeout 15m matches ci.yml's test job. The default 600s go test
    # timeout is too tight for the encoder's masking-driven budget
    # escalation on low-bitrate broadband content, so headroom is still
    # needed, but issue #37's bigValuesPrefixCost/rangeCost optimization cut
    # the full `go test ./...` wall time to about 323s locally, so 25m no
    # longer reflects the real cost; 15m keeps roughly 2x headroom over that
    # measurement for shared-runner load.
    cmds: [go test ./... -timeout 15m]
  lint:
    desc: Run golangci-lint (same config as go-flac/go-aac/go-wav)
    cmds: [golangci-lint run ./...]
  check:
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test
  oracle:build:
    dir: tools/oracle
    cmds: [./build.sh]
  oracle:dump:
    dir: tools/oracle
    cmds: [./dump-all.sh]
  fixtures:
    cmds: [scripts/gen-fixtures.sh]
  vectors:
    cmds: [scripts/fetch-vectors.sh]
  diff:
    desc: Fetch ISO vectors, build and dump the oracle, run the oracle and conformance differential tests
    cmds:
      - task: vectors
      - task: oracle:build
      - task: oracle:dump
      - go test ./... -run 'Oracle|Conformance'
  compat:
    desc: Encode the compat grid and verify with ffmpeg/mpg123 black-box binaries (fails if either is missing)
    cmds: [MP3_REQUIRE_COMPAT=1 go test ./ -run Compat -v -timeout 15m]
