version: '3'

tasks:
  build:
    cmds: [go build ./...]
  vet:
    cmds: [go vet ./...]
  test:
    cmds: [go test ./...]
  lint:
    desc: Run golangci-lint (same config as go-flac/go-aac/go-wav)
    cmds: [golangci-lint run ./...]
  check:
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test
  oracle:build:
    dir: tools/oracle
    cmds: [./build.sh]
  oracle:dump:
    dir: tools/oracle
    cmds: [./dump-all.sh]
  fixtures:
    cmds: [scripts/gen-fixtures.sh]
  vectors:
    cmds: [scripts/fetch-vectors.sh]
  diff:
    desc: Fetch ISO vectors, build and dump the oracle, run the oracle and conformance differential tests
    cmds:
      - task: vectors
      - task: oracle:build
      - task: oracle:dump
      - go test ./internal/dec/ -run 'Oracle|Conformance'
