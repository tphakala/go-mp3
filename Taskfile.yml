version: '3'

tasks:
  build:
    cmds: [go build ./...]
  vet:
    cmds: [go vet ./...]
  test:
    # -timeout 20m matches ci.yml's test job. The default 600s go test
    # timeout is too tight for the encoder's masking-driven budget
    # escalation on low-bitrate broadband content, so headroom is still
    # needed. Issue #37's bigValuesPrefixCost/rangeCost optimization cut the
    # internal/enc escalation cost (the suite runs about 330s locally), but
    # the full suite is dominated by other packages and the slower shared CI
    # runner measures about 10-11 min, so 25m is lowered to 20m rather than
    # further; 20m keeps roughly 2x headroom over the observed CI runtime.
    cmds: [go test ./... -timeout 20m]
  lint:
    desc: Run golangci-lint (same config as go-flac/go-aac/go-wav)
    cmds: [golangci-lint run ./...]
  check:
    cmds:
      - task: build
      - task: vet
      - task: lint
      - task: test
  oracle:build:
    dir: tools/oracle
    cmds: [./build.sh]
  oracle:dump:
    dir: tools/oracle
    cmds: [./dump-all.sh]
  fixtures:
    cmds: [scripts/gen-fixtures.sh]
  vectors:
    cmds: [scripts/fetch-vectors.sh]
  diff:
    desc: Fetch ISO vectors, build and dump the oracle, run the oracle and conformance differential tests
    cmds:
      - task: vectors
      - task: oracle:build
      - task: oracle:dump
      - go test ./... -run 'Oracle|Conformance'
  compat:
    desc: Encode the compat grid and verify with ffmpeg/mpg123 black-box binaries (fails if either is missing)
    cmds: [MP3_REQUIRE_COMPAT=1 go test ./ -run Compat -v -timeout 20m]
  quality:
    desc: Compare the encoder against LAME (black-box binary) on the synthetic corpus and write tools/quality/out/report.md (ViSQOL and PEAQ are used when on PATH); pass flags after --
    cmds: [go run ./tools/quality {{.CLI_ARGS}}]
  quality:smoke:
    desc: One-case end-to-end smoke test of the quality harness against lame (fails if lame is missing)
    cmds: [MP3_REQUIRE_LAME=1 go test ./tools/quality -run 'TestQualityHarness' -v -timeout 10m]
